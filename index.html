<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1c2e1c;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #e0e8d5;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, #2f4d2f 8%, transparent 10%),
                radial-gradient(circle at 80% 20%, #3b5c2b 12%, transparent 14%),
                radial-gradient(circle at 40% 70%, #1e3b1e 10%, transparent 13%),
                radial-gradient(circle at 70% 60%, #4f6d3b 9%, transparent 11%),
                radial-gradient(circle at 10% 80%, #2b4120 11%, transparent 13%),
                radial-gradient(circle at 60% 10%, #1e3b2b 7%, transparent 9%),
                radial-gradient(circle at 90% 40%, #3d592d 10%, transparent 12%),
                radial-gradient(circle at 30% 90%, #4a6540 11%, transparent 13%);
            background-color: #1a2e1a;
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .menu-screen {
            background: rgba(20, 35, 20, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 3rem 2rem;
            margin: 2rem auto;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);
            border: 1px solid #4c6b3b;
        }

        .military-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #cddba8;
            text-shadow: 3px 3px 0 #1f2e0e;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .menu-btn {
            background: #2f4d2a;
            border: 2px solid #9bb47a;
            color: #f0f5e1;
            padding: 1.2rem 2.5rem;
            margin: 1rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #1f3318, 0 10px 15px -5px rgba(0,0,0,0.5);
            background-image: linear-gradient(to bottom, #3d5e33, #1f361b);
        }

        .menu-btn:hover {
            background: #4b6e3e;
            border-color: #d5e0b2;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #1f3318, 0 12px 20px -5px rgba(0,0,0,0.6);
        }

        .menu-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1f3318, 0 5px 10px rgba(0,0,0,0.5);
        }

        .exam-screen, .study-screen, .result-screen {
            background: rgba(18, 28, 16, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 1.5rem 1.8rem;
            margin: 1rem auto;
            max-width: 1000px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid #5b7e45;
        }

        .timer-box {
            background: #0f1f0e;
            border: 2px solid #c5b87a;
            border-radius: 30px;
            padding: 0.5rem 1.8rem;
            font-size: 1.8rem;
            font-weight: 700;
            color: #f5e56c;
            display: inline-block;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-family: monospace;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin: 1.5rem 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-btn {
            background: #2a4020;
            border: 2px solid #7e9f60;
            color: #f0f7e6;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            background: #3d5e2e;
            border-color: #c2d6a5;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #1f2e1a;
            border-color: #5a6e4a;
        }

        .finish-btn {
            background: #8b6c2c;
            border-color: #e0c06b;
            color: #fff3cf;
        }

        .finish-btn:hover {
            background: #a8843a;
        }

        .question-card-exam {
            background: #172415;
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid #4d6d3b;
            margin-bottom: 1rem;
        }

        .q-num {
            font-weight: 800;
            background: #2b4421;
            color: #c4d98b;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 0.8rem;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #e6f0cf;
        }

        .option-btn {
            background: #1c2918;
            border: 2px solid #3f5530;
            border-radius: 18px;
            padding: 0.7rem 1.2rem;
            margin: 0.4rem 0;
            text-align: left;
            font-size: 0.95rem;
            color: #d9e8c5;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover {
            background: #2c3d24;
            border-color: #8ab357;
        }

        .option-btn.selected {
            background: #2e4a1f;
            border-color: #f0d16c;
            box-shadow: 0 0 8px #f0d16c55;
            color: #fff;
        }

        .option-prefix {
            font-weight: 700;
            width: 28px;
            color: #bddc7a;
        }

        .hidden-navigator {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: #0f1c0c;
            padding: 0.8rem;
            border-radius: 20px;
            border: 1px solid #506d39;
        }

        .nav-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #617d45;
            background: #1e311a;
            color: #cddfb2;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .nav-dot.answered {
            background: #3c6028;
            border-color: #b2cf70;
        }

        .nav-dot.active {
            border: 3px solid #f5e56c;
            transform: scale(1.1);
        }

        .study-block {
            margin: 1rem 0;
        }

        .correct-answer {
            background: #1e4a2c;
            border-left: 6px solid #7ed56f;
        }

        .correct-answer::after {
            content: "✓ Правильный ответ";
            float: right;
            color: #bcf0a8;
            font-size: 0.8rem;
            font-weight: 500;
            background: #0f2f1a;
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e301a;
            border-radius: 30px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            border: 2px solid #8aa764;
            color: #eaf0d8;
        }

        .grade-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: #11200c;
        }

        .grade-table th, .grade-table td {
            border: 1px solid #5e7845;
            padding: 0.5rem;
            text-align: center;
        }

        .btn-small {
            background: #3a552a;
            border: none;
            color: #f0f5dd;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            margin: 0.3rem;
        }

        @media (max-width: 650px) {
            .menu-btn {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container" id="appRoot">
    <!-- Main Menu -->
    <div id="menuScreen" class="menu-screen">
        <div class="military-title">
            <span>★</span> ТАКТИКА <span>★</span>
        </div>
        <p style="margin-bottom:2rem; color:#bccf9a;">4 семестр · симулятор подготовки (100 вопросов)</p>
        <button class="menu-btn" id="startExamBtn">🎯 Симулятор экзамена (30 вопросов)</button>
        <button class="menu-btn" id="startStudyBtn">📚 Изучение по блокам (4 блока по 25)</button>
    </div>

    <!-- Exam Simulator Screen -->
    <div id="examScreen" class="exam-screen" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <button class="nav-btn" id="exitExamBtn">↩ В меню</button>
            <div class="timer-box" id="examTimer">30:00</div>
            <button class="nav-btn" id="toggleNavigatorBtn">📋 Навигатор</button>
        </div>
        <div id="examQuestionContainer"></div>
        <div class="nav-buttons">
            <button class="nav-btn" id="examBackBtn">◀ Назад</button>
            <button class="nav-btn" id="examNextBtn">Следующее ▶</button>
            <button class="nav-btn finish-btn" id="examFinishBtn" style="display:none;">🏁 Завершить</button>
        </div>
        <div id="examNavigator" class="hidden-navigator" style="display:none;"></div>
    </div>

    <!-- Study Screen (Blocks) -->
    <div id="studyScreen" class="study-screen" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <button class="nav-btn" id="exitStudyBtn">↩ В меню</button>
            <h2 style="color:#d5e6b5;">Блок <span id="currentBlockNum">1</span></h2>
            <span></span>
        </div>
        <div id="studyQuestionsContainer" style="max-height:65vh; overflow-y:auto; padding-right:10px;"></div>
        <div class="nav-buttons" style="justify-content:center; gap:20px;">
            <button class="nav-btn" id="nextBlockBtn">Следующий блок ▶</button>
            <button class="nav-btn finish-btn" id="selfTestBtn">⚡ Проверить себя</button>
        </div>
    </div>

    <!-- Self-test mode (25 questions) -->
    <div id="selfTestScreen" class="exam-screen" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <button class="nav-btn" id="exitSelfTestBtn">↩ К блоку</button>
            <div class="timer-box" id="selfTestTimer">25:00</div>
        </div>
        <div id="selfTestQuestionContainer"></div>
        <div class="nav-buttons">
            <button class="nav-btn" id="selfTestBackBtn">◀ Назад</button>
            <button class="nav-btn" id="selfTestNextBtn">Следующее ▶</button>
            <button class="nav-btn finish-btn" id="selfTestFinishBtn" style="display:none;">🏁 Завершить</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="result-screen" style="display:none;"></div>

    <!-- Modal for unfinished questions -->
    <div id="unfinishedModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>⚠️ Пропущенные вопросы</h3>
            <div id="unfinishedList" style="margin:1rem 0;"></div>
            <button class="btn-small" id="closeUnfinishedModal">Вернуться к вопросам</button>
            <button class="btn-small finish-btn" id="forceFinishBtn">Завершить тест</button>
        </div>
    </div>
</div>

<script>

            { text: "Мотопехотная рота армии США в наступлении обычно действует в составе:", options: ["Мотопехотного батальона, где она может находится в первом или во втором эшелоне или наступать самостоятельно.", "Мотопехотного батальона, где она может находится в первом эшелоне.", "Мотопехотного батальона, где она может находится в первом или во втором эшелоне (резерве).", "Мотопехотного батальона, где она может находится в первом или во втором эшелоне"], correct: 2 },

            { text: "В чем заключается ближайшая задача МПР армии США в наступлении?", options: ["В уничтожении противника в опорном пункте роты.", "В уничтожении противника в опорном пункте роты противника и овладении им.", "В уничтожении противника в опорном пункте взвода противника и овладении им", "В уничтожении противника в опорном пункте батальона противника и овладении им."], correct: 1 },
            { text: "В чем заключается последующая задача МПР армии США в наступлении?", options: ["В завершении во взаимодействии с соседями уничтожения противника в районе обороны роты второго эшелона и овладении им.", "В завершении во взаимодействии с соседями уничтожения противника в районе обороны роты первого эшелона и овладении им.", "В завершении во взаимодействии с соседями уничтожения противника в районе обороны батальона первого эшелона и овладении им.", "В завершении во взаимодействии с соседями уничтожения противника в районе обороны батальона второго эшелона и овладении им"], correct: 2 },

            { text: "Мотострелковый взвод действует:", options: ["В составе батальона во взаимодействии с соседними взводами при поддержке средств старшего командира (начальника).", "В составе роты во взаимодействии с соседними отделениями при поддержке средств старшего командира (начальника).", "В составе роты во взаимодействии с соседними взводами при поддержке средств старшего командира (начальника).", "В составе роты во взаимодействии с соседями при поддержке артиллерии"], correct: 2 },
            { text: "Мотострелковый взвод может обороняться в составе:", options: ["Роты в первом или во втором эшелоне, на главном или второстепенном направлении.", "Роты в первом или во втором эшелоне, на главном или второстепенном направлении, а также в резерве полка.", "Роты в первом или во втором эшелоне, на главном или второстепенном направлении, а также в резерве батальона.", "Роты в первом или во втором эшелоне, а также в резерве батальона"], correct: 2 },
            { text: "На МСВ, обороняющийся в первом эшелоне на главном направлении, возлагается задача:", options: ["Нанести всеми видами огня во взаимодействии с соседями решительное поражение противнику перед передним краем, отразить его атаку и удержать занимаемый опорный пункт.", "Нанести всеми видами огня поражение противнику перед передним краем, отразить его атаку и удержать занимаемый опорный пункт.", "Нанести всеми видами огня во взаимодействии с соседями решительное поражение противнику перед передним краем, отразить его атаку и удержать занимаемую позицию.", "Нанести всеми видами огня во взаимодействии с соседями решительное поражение противнику, удержать занимаемый опорный пункт."], correct: 0 },
            { text: "Задача МСВ, обороняющего в составе роты во втором эшелоне батальона, состоит в том, чтобы:", options: ["Удержать опорный пункт и уничтожить вклинившегося в оборону противника, а также быть в готовности к замене подразделений первого эшелона в случае потери ими боеспособности и проведению контратак совместно со вторыми эшелонами, резервами старшего командира.", "Удержать позицию и уничтожить вклинившегося в оборону противника, а также быть в готовности к замене подразделений первого эшелона в случае потери ими боеспособности и проведению контратак совместно со вторыми эшелонами.", "Удержать опорный пункт и уничтожить вклинившегося в оборону противника, а также проведению контратак совместно со вторыми эшелонами, резервами старшего командира.", "Удержать опорный пункт роты и уничтожить противника на переднем крае, а также быть в готовности к замене подразделений первого эшелона в случае потери ими боеспособности и проведению контратак совместно со вторыми эшелонами, резервами старшего командира."], correct: 0 },
            { text: "Построение обороны мотострелкового взвода включает:", options: ["Боевой порядок взвода, опорный пункт роты и систему огня.", "Боевой порядок отделений, опорный пункт взвода и систему огня.", "Боевой порядок взвода, опорный пункт взвода и систему огня.", "Боевой порядок взвода, опорный пункт взвода и подготовку огня"], correct: 2 },
            { text: "Боевой порядок мотострелкового взвода строится:", options: ["В один эшелон, два эшелона.", "Положение отделений в одну линию, положение отделений в две линии.", "Положение отделений в одну линию, положение отделений в две линии, положение отделений уступом вправо (влево).", "В один эшелон, два эшелона, уступом вправо (влево)"], correct: 2 },
            { text: "При угрозе атаки с фланга боевой порядок МСВ может строиться:", options: ["В круговую оборону.", "В линию отделений.", "Уступом вперед или назад.", "Уступом вправо или влево."], correct: 3 },
            { text: "Опорный пункт мотострелкового взвода это:", options: ["Участок местности, часть оборонительной позиции (района обороны), наиболее насыщенной огневыми средствами.", "Участок местности, часть оборонительной позиции (района обороны), наиболее насыщенной огневыми средствами, оборудованной в инженерном отношении и приспособленной к круговой обороне.", "Участок местности, часть оборонительной позиции (района обороны), оборудованной в инженерном отношении и приспособленной к круговой обороне", "Местность или часть оборонительной позиции, наиболее насыщенной огневыми средствами, оборудованной в инженерном отношении и приспособленной к обороне."], correct: 1 },
            { text: "Опорный пункт мотострелкового взвода состоит из (полное определение):", options: ["Позиций отделений, основных, запасных и временных огневых позиций боевых машин пехоты (бронетранспортеров) и приданных огневых средств, командно-наблюдательного пункта командира взвода.", "Позиций отделений, основных огневых позиций боевых машин пехоты (бронетранспортеров) и приданных огневых средств, командно-наблюдательного пункта командира взвода.", "Позиций отделений, основных, запасных и временных огневых позиций боевых машин пехоты (бронетранспортеров) и приданных огневых средств.", "Позиций отделений, основных, запасных огневых позиций боевых машин пехоты (бронетранспортеров) и приданных противотанковых средств, командно-наблюдательного пункта командира взвода."], correct: 0 },
            { text: "Мотострелковый взвод обороняет опорный пункт (по фронту/глубине):", options: ["До 400 м по фронту и до 300 м в глубину.", "400 м по фронту и 300 м в глубину.", "До 300 м по фронту и до 400 м в глубину.", "До 500 м по фронту и до 400 м в глубину."], correct: 0 },
            { text: "Мотострелковое отделение в обороне занимает позицию:", options: ["До 50 м по фронту.", "100 м по фронту", "До 100 м по фронту.", "До 100 м в глубину."], correct: 2 },
            { text: "Между позициями отделений могут быть промежутки:", options: ["25 м, в которых располагаются приданные взводу и подчиненные старшему командиру огневые средства.", "До 25 м, в которых располагаются приданные взводу и подчиненные старшему командиру огневые средства.", "50 м, в которых располагаются приданные взводу и подчиненные старшему командиру огневые средства.", "До 50 м, в которых располагаются приданные взводу и подчиненные старшему командиру огневые средства."], correct: 3 },
            { text: "Боевые машины пехоты и танки в опорном пункте взвода располагаются по фронту и в глубину с интервалом:", options: ["До 100 м.", "200 м", "До 200 м.", "До 50 м."], correct: 2 },
            { text: "Для круговой обороны опорного пункта подготавливаются:", options: ["Временные огневые позиции для боевых машин пехоты (бронетранспортеров), танков, ПТУР, гранатометов преимущественно для ведения огня в стороны флангов и тыла.", "Запасные огневые позиции для боевых машин пехоты (бронетранспортеров)", "Запасные огневые позиции для боевых машин пехоты (бронетранспортеров), танков, ПТУР, гранатометов преимущественно для ведения огня в стороны флангов и тыла.", "Временные огневые позиции для боевых машин пехоты (бронетранспортеров), танков, ПТУР, гранатометов преимущественно для ведения огня в стороны флангов и тыла."], correct: 2 },
            { text: "Боевая задача мотострелкового взвода, обороняющегося в первом эшелоне, заключается:", options: ["В нанесении всеми видами огня во взаимодействии с соседями решительного поражения противнику перед передним краем, отражения его атаки и удержании занимаемого опорного пункта.", "В нанесении всеми видами огня во взаимодействии с соседями решительного поражения противнику в глубине обороны, отражения его атаки и удержании занимаемого опорного пункта.", "В нанесении поражения противнику перед передним краем, отражения его атаки и удержании занимаемого опорного пункта.", "В нанесении всеми видами огня во взаимодействии с соседями решительного поражения противнику перед передним краем, отражения его атаки и удержании позиции."], correct: 0 },
            { text: "МСВ, обороняющийся в составе роты во втором эшелоне батальона, находится:", options: ["В готовности к уничтожению вклинившегося в оборону противника и прочному удержанию занимаемой позиции, а также в готовности к замене подразделений второго эшелона.", "В готовности к уничтожению противника и прочному удержанию занимаемого района обороны, а также в готовности к замене подразделений первого эшелона в случае потери ими боеспособности.", "В готовности к уничтожению вклинившегося в оборону противника и прочному удержанию занимаемого опорного пункта, а также в готовности к замене подразделений второго эшелона в случае потери ими боеспособности.", "В готовности к уничтожению вклинившегося в оборону противника и прочному удержанию занимаемого опорного пункта, а также в готовности к замене подразделений первого эшелона в случае потери ими боеспособности."], correct: 3 },
            { text: "МСВ, назначенный в резерв батальона, занимает опорный пункт и находится в готовности:", options: ["К отражению атаки вклинившегося в оборону противника, уничтожению его воздушных десантов, аэромобильных и диверсионно-разведывательных групп, высадившихся в глубине батальонного района, усилению (замене) подразделений первого эшелона в случае потери ими боеспособности и к решению других внезапно возникающих задач.", "К отражению атаки противника, уничтожению его воздушных десантов, аэромобильных, высадившихся в глубине батальонного района, усилению (замене) подразделений первого эшелона в случае потери ими боеспособности.", "К отражению атаки вклинившегося в оборону противника, уничтожению его воздушных десантов, аэромобильных и диверсионно-разведывательных групп, высадившихся в глубине ротного опорного пункта, усилению (замене) подразделений второго эшелона в случае потери ими боеспособности и к решению других внезапно возникающих задач.", "К отражению атаки вклинившегося в оборону противника, уничтожению его воздушных десантов, аэромобильных и диверсионно-разведывательных групп, высадившихся в глубине батальонного района."], correct: 0 },
            { text: "Мотострелковый взвод, назначенный в резерв батальона, занимает:", options: ["Указанный участок местности.", "Позицию.", "Район обороны.", "Опорный пункт."], correct: 3 },
            { text: "Мотострелковый взвод, назначенный в огневую засаду, занимает:", options: ["Указанный район огневой засады и проводит тщательную маскировку", "Указанный опорный пункт и проводит тщательную маскировку.", "Указанную позицию и проводит тщательную маскировку.", "Указанную позицию и проводит мероприятия по проведению огневой засады."], correct: 2 },
            { text: "Бронегруппа создается из:", options: ["Нескольких танков, САУ и боевых машин пехоты (обычно без десанта).", "Танка и боевых машин пехоты (обычно без десанта).", "Нескольких танков и боевой машины пехоты (обычно без десанта).", "Нескольких танков и боевых машин пехоты (обычно без десанта)."], correct: 3 },
            { text: "Система огня в обороне – это:", options: ["Организованное сочетание огня артиллерии, танков и БМП для поражения противника.", "Организованный огонь всех видов оружия для поражения противника.", "Организованное по единому плану сочетание огня стрелкового оружия и БМП для поражения противника.", "Организованное по единому плану сочетание огня всех видов оружия для поражения противника."], correct: 3 },
            { text: "Система огня включает:", options: ["Участки сосредоточенного огня роты, зоны противотанкового огня боевых машин пехоты и сплошного многослойного огня всех других огневых средств взвода, подготовленный маневр огнем боевых машин пехоты на угрожаемые направления.", "Участки сосредоточенного огня отделений, зоны противотанкового огня боевых машин пехоты (танков) и сплошного многослойного огня всех других огневых средств взвода, подготовленный маневр огнем боевых машин пехоты (танков) на угрожаемые направления.", "Участки сосредоточенного огня взвода, зоны противотанкового огня боевых машин пехоты (танков) и сплошного многослойного огня всех других огневых средств взвода.", "Участки сосредоточенного огня взвода, зоны противотанкового огня боевых машин пехоты (танков) и сплошного многослойного огня всех других огневых средств взвода, подготовленный маневр огнем боевых машин пехоты (танков) на угрожаемые направления."], correct: 3 },
            { text: "Основу системы огня взвода составляет:", options: ["Огонь танков, САУ, боевых машин пехоты (бронетранспортеров), противотанковых гранатометов и пулеметов", "Огонь танков, боевых машин пехоты (бронетранспортеров), противотанковых гранатометов и пулеметов.", "Огонь танков, боевых машин пехоты (бронетранспортеров), противотанковых гранатометов.", "Огонь танков, бронетранспортеров, противотанковых гранатометов и пулеметов."], correct: 1 },
            { text: "Зона сплошного многослойного огня перед передним краем обороны назначается:", options: ["До 500 м.", "400 м.", "До 400 м.", "500 м."], correct: 2 },
            { text: "Плотность огня на участке сосредоточенного огня (СО) должна быть:", options: ["В 2-3 раза выше, чем обычная плотность перед опорным пунктом", "В 1,5-2 раза выше, чем обычная плотность перед опорным пунктом.", "В 1,5 раза выше, чем обычная плотность перед опорным пунктом.", "В 2 раза выше, чем обычная плотность перед опорным пунктом."], correct: 1 },
            { text: "Участок сосредоточенного огня мотострелкового взвода может быть:", options: ["До 200 м.", "150 м.", "До 100 м.", "До 150 м."], correct: 3 },
            { text: "Сосредоточенный огонь из автоматов и ручных пулеметов ведется на дальность:", options: ["450-650 м.", "500-600 м.", "400-500 м.", "400-600 м."], correct: 3 },
            { text: "Сосредоточенный огонь из пулеметов ПК и ПКТ ведется на дальность:", options: ["1500 м.", "1000 м", "До 1000 м.", "До 1500 м."], correct: 2 },
            { text: "Сосредоточенный огонь из пулемета КПВТ ведется на дальность:", options: ["До 2000 м.", "2000 м.", "До 2500 м.", "До 1500 м."], correct: 0 },
            { text: "Для БМП участки сосредоточенного огня назначаются на удалении:", options: ["1,5-2,5 км от переднего края обороны.", "1-2 км от переднего края обороны.", "1-3 км от переднего края обороны.", "2-3 км от переднего края обороны."], correct: 3 },
            { text: "Ширина участка СО для БМП может быть:", options: ["До 85 м (по 30 м на орудие для осколочной гранаты), а глубина - до 50 м.", "До 60 м (по 20 м на орудие для осколочной гранаты), а глубина - до 50 м.", "До 75 м (по 20 м на орудие для осколочной гранаты), а глубина - до 25 м.", "До 75 м (по 25 м на орудие для осколочной гранаты), а глубина - до 50 м."], correct: 3 },
            { text: "Готовность системы огня определяется:", options: ["Занятием боевыми машинами пехоты (БТР), танками, орудиями и другими огневыми средствами огневых позиций, подготовкой данных для стрельбы, а также наличием боеприпасов.", "Занятием боевыми машинами пехоты (БТР), танками, орудиями и другими огневыми средствами огневых позиций, подготовкой данных для стрельбы.", "Занятием боевыми машинами пехоты (БТР), танками, орудиями и другими огневыми средствами огневых позиций, наличием боеприпасов.", "Занятием боевыми машинами пехоты (БТР), орудиями и другими огневыми средствами окопов, подготовкой данных для стрельбы, а также наличием боеприпасов."], correct: 0 },
            { text: "Боевым машинам пехоты (БТР), пулеметам, танкам и другим огневым средствам назначаются:", options: ["Основные, запасные и временные огневые позиции, основной и дополнительный секторы обстрела.", "Основные и временные огневые позиции, основной и временный секторы обстрела на дальность их действительного огня", "Основные и запасные огневые позиции, основной и дополнительный секторы обстрела на дальность их действительного огня.", "Основные и запасные огневые позиции, основной и дополнительный, временный секторы обстрела на прицельную дальность."], correct: 2 },
            { text: "Наступление может вестись на:", options: ["Наступающего, отходящего противника.", "Наступающего, обороняющегося противника", "Наступающего, отходящего, обороняющегося противника.", "Наступающего, отступающего, обороняющегося противника."], correct: 2 },

                [26,86,'B+',3.33],[25,83,'B',3.0],[24,80,'B',3.0],[23,76,'B-',2.67],
                [22,73,'C+',2.33],[21,70,'C+',2.33],[20,66,'C',2.0],[19,63,'C-',1.67],
                [18,60,'C-',1.67],[17,56,'D+',1.33],[16,53,'D',1.0],[15,50,'D',1.0],
                [14,46,'F',0]
            ];
            for (let [s,percent,letter,gpa] of table) if (score >= s) return {percent,letter,gpa};
            return {percent:46,letter:'F',gpa:0};
        }

        function grade25(score) {
            if (score === 25) return {percent:100,letter:'A+',gpa:4.0};
            if (score >= 24) return {percent:96,letter:'A',gpa:4.0};
            if (score >= 23) return {percent:92,letter:'A-',gpa:3.67};
            if (score >= 22) return {percent:88,letter:'B+',gpa:3.33};
            if (score >= 21) return {percent:84,letter:'B',gpa:3.0};
            if (score >= 20) return {percent:80,letter:'B',gpa:3.0};
            if (score >= 19) return {percent:76,letter:'B-',gpa:2.67};
            if (score >= 18) return {percent:72,letter:'C+',gpa:2.33};
            if (score >= 17) return {percent:68,letter:'C+',gpa:2.33};
            if (score >= 16) return {percent:64,letter:'C',gpa:2.0};
            if (score >= 15) return {percent:60,letter:'C-',gpa:1.67};
            if (score >= 14) return {percent:56,letter:'C-',gpa:1.67};
            if (score >= 13) return {percent:52,letter:'D+',gpa:1.33};
            if (score >= 12) return {percent:48,letter:'D',gpa:1.0};
            return {percent:44,letter:'F',gpa:0};
        }

        // --- Перемешивание ---
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- Глобальное состояние ---
        let currentMode = null;
        let examQuestions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let timerInterval = null;
        let timeLeft = 0;
        let selfTestBlockIndex = 0;

        // DOM элементы
        const menuScreen = document.getElementById('menuScreen');
        const examScreen = document.getElementById('examScreen');
        const studyScreen = document.getElementById('studyScreen');
        const selfTestScreen = document.getElementById('selfTestScreen');
        const resultScreen = document.getElementById('resultScreen');
        const unfinishedModal = document.getElementById('unfinishedModal');

        function showScreen(screen) {
            menuScreen.style.display = 'none';
            examScreen.style.display = 'none';
            studyScreen.style.display = 'none';
            selfTestScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            screen.style.display = 'block';
        }

        function startTimer(minutes, displayElement, onEnd) {
            timeLeft = minutes * 60;
            updateTimerDisplay(displayElement);
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(displayElement);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (onEnd) onEnd();
                }
            }, 1000);
        }

        function updateTimerDisplay(el) {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            el.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function renderTestQuestion(container, questions, answers, idx, showNavigator = false) {
            if (!questions.length) return;
            const q = questions[idx];
            let html = `<div class="question-card-exam"><span class="q-num">Вопрос ${idx+1} из ${questions.length}</span>`;
            html += `<div class="question-text">${q.text}</div>`;
            const prefixes = ['A','B','C','D'];
            q.options.forEach((opt, optIdx) => {
                const selected = answers[idx] === optIdx ? ' selected' : '';
                html += `<div class="option-btn${selected}" data-opt="${optIdx}"><span class="option-prefix">${prefixes[optIdx]})</span> ${opt}</div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
            document.querySelectorAll(`#${container.id} .option-btn`).forEach(btn => {
                btn.addEventListener('click', function() {
                    const opt = parseInt(this.dataset.opt);
                    answers[idx] = opt;
                    renderTestQuestion(container, questions, answers, idx, showNavigator);
                    if (showNavigator) renderNavigator(answers);
                });
            });
        }

        function renderNavigator(answers) {
            const nav = document.getElementById('examNavigator');
            nav.innerHTML = '';
            answers.forEach((ans, i) => {
                const dot = document.createElement('div');
                dot.className = 'nav-dot' + (ans !== null ? ' answered' : '') + (i === currentIndex ? ' active' : '');
                dot.textContent = i+1;
                dot.addEventListener('click', () => {
                    currentIndex = i;
                    renderTestQuestion(document.getElementById('examQuestionContainer'), examQuestions, userAnswers, currentIndex, true);
                    renderNavigator(userAnswers);
                    updateExamButtons();
                });
                nav.appendChild(dot);
            });
        }

        function updateExamButtons() {
            const backBtn = document.getElementById('examBackBtn');
            const nextBtn = document.getElementById('examNextBtn');
            const finishBtn = document.getElementById('examFinishBtn');
            backBtn.disabled = currentIndex === 0;
            if (currentIndex === examQuestions.length - 1) {
                nextBtn.style.display = 'none';
                finishBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                finishBtn.style.display = 'none';
            }
        }

        function startExam() {
            stopTimer();
            const selected = shuffle([...questionsBank]).slice(0, 30);
            examQuestions = selected;
            userAnswers = new Array(30).fill(null);
            currentIndex = 0;
            showScreen(examScreen);
            document.getElementById('examNavigator').style.display = 'none';
            renderTestQuestion(document.getElementById('examQuestionContainer'), examQuestions, userAnswers, currentIndex, false);
            updateExamButtons();
            startTimer(30, document.getElementById('examTimer'), () => {
                alert('Время вышло! Тест автоматически завершён.');
                finishExam(true);
            });
        }

        function finishExam(force = false) {
            stopTimer();
            const unanswered = userAnswers.map((ans, i) => ans === null ? i : null).filter(i => i !== null);
            if (!force && unanswered.length > 0) {
                showUnfinishedModal(unanswered, () => finishExam(true));
                return;
            }
            let correct = 0;
            examQuestions.forEach((q, i) => { if (userAnswers[i] === q.correct) correct++; });
            const grade = grade30(correct);
            showResult(correct, 30, grade, 'exam');
        }

        function showUnfinishedModal(unansweredIndices, onForceFinish) {
            const list = document.getElementById('unfinishedList');
            list.innerHTML = unansweredIndices.map(i => `<button class="btn-small" style="margin:4px;" data-idx="${i}">Вопрос ${i+1}</button>`).join('');
            document.querySelectorAll('#unfinishedList button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    currentIndex = idx;
                    unfinishedModal.style.display = 'none';
                    renderTestQuestion(document.getElementById('examQuestionContainer'), examQuestions, userAnswers, currentIndex, true);
                    updateExamButtons();
                    document.getElementById('examNavigator').style.display = 'flex';
                    renderNavigator(userAnswers);
                });
            });
            document.getElementById('closeUnfinishedModal').onclick = () => { unfinishedModal.style.display = 'none'; };
            document.getElementById('forceFinishBtn').onclick = () => {
                unfinishedModal.style.display = 'none';
                onForceFinish();
            };
            unfinishedModal.style.display = 'flex';
        }

        function showResult(correct, total, grade, mode) {
            stopTimer();
            showScreen(resultScreen);
            let html = `<h2 style="color:#d5e6b5;">Результат теста</h2>`;
            html += `<p>Правильных ответов: <strong>${correct} из ${total}</strong></p>`;
            html += `<p>Процент: ${grade.percent}% | Оценка: ${grade.letter} (GPA: ${grade.gpa})</p>`;
            html += `<table class="grade-table"><tr><th>Баллы</th><th>%</th><th>Оценка</th><th>GPA</th></tr>`;
            const table = (total===30) ? [
                [30,100,'A+',4.0],[29,96,'A',4.0],[28,93,'A-',3.67],[27,90,'A-',3.67],
                [26,86,'B+',3.33],[25,83,'B',3.0],[24,80,'B',3.0],[23,76,'B-',2.67],
                [22,73,'C+',2.33],[21,70,'C+',2.33],[20,66,'C',2.0],[19,63,'C-',1.67],
                [18,60,'C-',1.67],[17,56,'D+',1.33],[16,53,'D',1.0],[15,50,'D',1.0],
                [14,46,'F',0]
            ] : [
                [25,100,'A+',4.0],[24,96,'A',4.0],[23,92,'A-',3.67],[22,88,'B+',3.33],
                [21,84,'B',3.0],[20,80,'B',3.0],[19,76,'B-',2.67],[18,72,'C+',2.33],
                [17,68,'C+',2.33],[16,64,'C',2.0],[15,60,'C-',1.67],[14,56,'C-',1.67],
                [13,52,'D+',1.33],[12,48,'D',1.0],[11,44,'F',0]
            ];
            table.forEach(row => { html += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`; });
            html += `</table>`;
            if (mode === 'exam') {
                html += `<button class="nav-btn" id="retryExamBtn">🔄 Пройти ещё один тест (30 вопросов)</button>`;
                html += `<button class="nav-btn" id="menuFromResultBtn">↩ Вернуться в меню</button>`;
            } else if (mode === 'selfTest') {
                html += `<button class="nav-btn" id="nextBlockAfterSelfBtn">▶ Перейти к следующему блоку</button>`;
                html += `<button class="nav-btn" id="menuFromSelfResultBtn">↩ Вернуться в меню</button>`;
            }
            resultScreen.innerHTML = html;
            if (mode === 'exam') {
                document.getElementById('retryExamBtn')?.addEventListener('click', startExam);
                document.getElementById('menuFromResultBtn')?.addEventListener('click', goToMenu);
            } else if (mode === 'selfTest') {
                document.getElementById('nextBlockAfterSelfBtn')?.addEventListener('click', () => {
                    selfTestBlockIndex++;
                    if (selfTestBlockIndex >= blocks.length) selfTestBlockIndex = 0;
                    loadStudyBlock(selfTestBlockIndex);
                });
                document.getElementById('menuFromSelfResultBtn')?.addEventListener('click', goToMenu);
            }
        }

        function goToMenu() {
            stopTimer();
            showScreen(menuScreen);
        }

        function loadStudyBlock(blockIdx) {
            stopTimer();
            selfTestBlockIndex = blockIdx;
            const block = blocks[blockIdx];
            document.getElementById('currentBlockNum').textContent = blockIdx + 1;
            const container = document.getElementById('studyQuestionsContainer');
            let html = '';
            block.forEach((q, idx) => {
                html += `<div class="question-card-exam"><span class="q-num">Вопрос ${idx+1}</span>`;
                html += `<div class="question-text">${q.text}</div>`;
                const prefixes = ['A','B','C','D'];
                q.options.forEach((opt, optIdx) => {
                    const correctClass = (optIdx === q.correct) ? ' correct-answer' : '';
                    html += `<div class="option-btn${correctClass}"><span class="option-prefix">${prefixes[optIdx]})</span> ${opt}</div>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
            document.getElementById('nextBlockBtn').disabled = (blockIdx === blocks.length - 1);
            document.getElementById('nextBlockBtn').onclick = () => {
                if (blockIdx < blocks.length - 1) loadStudyBlock(blockIdx + 1);
            };
            document.getElementById('selfTestBtn').onclick = () => startSelfTest(blockIdx);
            showScreen(studyScreen);
        }

        function startSelfTest(blockIdx) {
            stopTimer();
            const blockQuestions = shuffle([...blocks[blockIdx]]);
            examQuestions = blockQuestions;
            userAnswers = new Array(blockQuestions.length).fill(null);
            currentIndex = 0;
            showScreen(selfTestScreen);
            renderTestQuestion(document.getElementById('selfTestQuestionContainer'), examQuestions, userAnswers, currentIndex, false);
            updateSelfTestButtons();
            startTimer(25, document.getElementById('selfTestTimer'), () => {
                alert('Время вышло! Самопроверка завершена.');
                finishSelfTest();
            });
        }

        function updateSelfTestButtons() {
            document.getElementById('selfTestBackBtn').disabled = currentIndex === 0;
            if (currentIndex === examQuestions.length - 1) {
                document.getElementById('selfTestNextBtn').style.display = 'none';
                document.getElementById('selfTestFinishBtn').style.display = 'inline-block';
            } else {
                document.getElementById('selfTestNextBtn').style.display = 'inline-block';
                document.getElementById('selfTestFinishBtn').style.display = 'none';
            }
        }

        function finishSelfTest() {
            stopTimer();
            let correct = 0;
            examQuestions.forEach((q, i) => { if (userAnswers[i] === q.correct) correct++; });
            const grade = grade25(correct);
            showResult(correct, examQuestions.length, grade, 'selfTest');
        }

        // Навигация экзамена
        document.getElementById('examBackBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderTestQuestion(document.getElementById('examQuestionContainer'), examQuestions, userAnswers, currentIndex, true);
                updateExamButtons();
                if (document.getElementById('examNavigator').style.display !== 'none') renderNavigator(userAnswers);
            }
        });
        document.getElementById('examNextBtn').addEventListener('click', () => {
            if (currentIndex < examQuestions.length - 1) {
                currentIndex++;
                renderTestQuestion(document.getElementById('examQuestionContainer'), examQuestions, userAnswers, currentIndex, true);
                updateExamButtons();
                if (document.getElementById('examNavigator').style.display !== 'none') renderNavigator(userAnswers);
            }
        });
        document.getElementById('examFinishBtn').addEventListener('click', () => finishExam(false));
        document.getElementById('toggleNavigatorBtn').addEventListener('click', () => {
            const nav = document.getElementById('examNavigator');
            if (nav.style.display === 'none' || nav.style.display === '') {
                nav.style.display = 'flex';
                renderNavigator(userAnswers);
            } else {
                nav.style.display = 'none';
            }
        });
        document.getElementById('exitExamBtn').addEventListener('click', () => { stopTimer(); goToMenu(); });

        document.getElementById('selfTestBackBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderTestQuestion(document.getElementById('selfTestQuestionContainer'), examQuestions, userAnswers, currentIndex, false);
                updateSelfTestButtons();
            }
        });
        document.getElementById('selfTestNextBtn').addEventListener('click', () => {
            if (currentIndex < examQuestions.length - 1) {
                currentIndex++;
                renderTestQuestion(document.getElementById('selfTestQuestionContainer'), examQuestions, userAnswers, currentIndex, false);
                updateSelfTestButtons();
            }
        });
        document.getElementById('selfTestFinishBtn').addEventListener('click', finishSelfTest);
        document.getElementById('exitSelfTestBtn').addEventListener('click', () => {
            stopTimer();
            loadStudyBlock(selfTestBlockIndex);
        });

        document.getElementById('startExamBtn').addEventListener('click', startExam);
        document.getElementById('startStudyBtn').addEventListener('click', () => loadStudyBlock(0));
        document.getElementById('exitStudyBtn').addEventListener('click', goToMenu);
    })();
</script>
</body>
</html>
